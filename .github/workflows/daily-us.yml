name: Daily US Close Report
on:
  schedule:
    # TW 21:17 / US next-day 06:37 Asia/Taipei; not an intraday scheduler.
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
    inputs:
      us_limit:
        description: "測試數量；留空為正式全量執行。測試不更新網站或通知。"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: stock-report-writer
  cancel-in-progress: false
jobs:
  build-report:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RADAR_MODE: shadow
      MARKET_LIMIT: ${{ github.event.inputs.us_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: radar-us-${{ github.run_id }}
          restore-keys: radar-us-
      - name: 安裝套件
        run: pip install -r requirements.txt
      - name: 驗證核心規則
        run: python -m unittest discover -s tests -v
      - name: 產生資料與報告
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "$MARKET_LIMIT" ]; then
            python main.py --market us --us-limit "$MARKET_LIMIT"
          else
            python main.py --market us
          fi
      - name: 發布報告與研究狀態
        if: env.MARKET_LIMIT == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p state
          git add docs/index.html docs/us_cache.json docs/highlights_log.json state/
          if ! git diff --cached --quiet; then
            git commit -m "Update us close report and radar state"
            git push
          fi
      - name: 發送已驗證且去重的收盤通知
        if: env.MARKET_LIMIT == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py --market us --send --checkpoint-git
      - name: 失敗通知
        if: failure() && env.MARKET_LIMIT == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python notify.py --market us --failure --send --checkpoint-git
      - name: 保存資料品質與測試診斷
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-quality-${{ github.run_id }}
          path: |
            .runtime/*quality.json
            .runtime/test_*cache.json
          if-no-files-found: ignore
