name: Daily US Close Report

on:
  schedule:
    # UTC 22:30 = 台灣時間 06:30（次日，美股收盤後、台股開盤前）
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      us_limit:
        description: "只抓前 N 檔美股（測試用，留空代表跑全部S&P500）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行美股收盤報告
        run: |
          if [ -n "${{ github.event.inputs.us_limit }}" ]; then
            python main.py --market us --us-limit "${{ github.event.inputs.us_limit }}"
          else
            python main.py --market us
          fi

      - name: 把最新報告推回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/us_cache.json docs/highlights_log.json
          git diff --cached --quiet && echo "沒有變動，略過 commit" || git commit -m "更新美股收盤報告 $(date -u +%Y-%m-%d)"
          git push

      - name: 發送 Telegram 通知
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "還沒設定 Telegram 密鑰，略過通知"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="美股收盤報告已更新：https://zceoagent.github.io/stock-watchlist/"
