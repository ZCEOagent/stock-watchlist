name: Radar data health
on:
  schedule:
    - cron: '47 15 * * *'
    - cron: '47 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-report-writer
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check both markets independently
        run: |
          status=0
          python healthcheck.py --market tw || status=1
          python healthcheck.py --market us || status=1
          exit "$status"
