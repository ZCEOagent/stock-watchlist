name: Daily TW Close Report

on:
  schedule:
    # UTC 06:00 = 台灣時間 14:00（台股收盤約30分鐘後，資料應已到位）
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tw_limit:
        description: "只抓前 N 檔台股（測試用，留空代表跑全市場）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行台股收盤報告
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tw_limit }}" ]; then
            python main.py --market tw --tw-limit "${{ github.event.inputs.tw_limit }}"
          else
            python main.py --market tw
          fi

      - name: 把最新報告推回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/tw_cache.json docs/highlights_log.json
          git diff --cached --quiet && echo "沒有變動，略過 commit" || git commit -m "更新台股收盤報告 $(date -u +%Y-%m-%d)"
          git push

      - name: 發送 Telegram 通知
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="台股收盤報告已更新：https://zceoagent.github.io/stock-watchlist/"
