name: Daily Stock Watchlist

on:
  schedule:
    # UTC 23:30 = 台灣時間 07:30（次日）。美股收盤後留一點緩衝時間再抓，資料更完整，
    # 平常情況下（上市走官方API、上櫃走FinMind）幾分鐘內就能跑完，07:30 這個時間點還是比 9:00 開盤早很多。
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      tw_limit:
        description: "只抓前 N 檔台股（測試用，留空代表跑全市場）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行主程式，產生報告
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tw_limit }}" ]; then
            python main.py --tw-limit "${{ github.event.inputs.tw_limit }}"
          else
            python main.py
          fi

      - name: 把最新報告推回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/highlights_log.json
          git diff --cached --quiet && echo "沒有變動，略過 commit" || git commit -m "更新每日觀察清單 $(date -u +%Y-%m-%d)"
          git push
