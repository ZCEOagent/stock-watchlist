name: Diagnostic Yahoo from runner
on:
  push:
    branches: [diag/yahoo-runner]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.34.2 yfinance==1.7.0
      - run: python diag_yahoo.py
